[project]
name = "tech-decomposition"
version = "0.2.0"
description = "Multi-repo code Q&A + Jira ticket → AI tech decomposition"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai>=0.0.13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "mcp>=1.2",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "markdown>=3.7",
]

[project.scripts]
tech-decomposition = "tech_decomposition.cli:main"
td = "tech_decomposition.cli:main"
tech-decomposition-analyze = "tech_decomposition.analyze:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# The current adapter set (cline_sdk, opencode, cursor) has no extra Python
# deps — Cline runs through the Node sidecar at ``bridge/cline_sdk/``,
# OpenCode and Cursor are external CLI binaries. Left empty so external
# references to ``.[adapters]`` keep working.
adapters = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_decomposition"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
