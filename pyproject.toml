[project]
name = "tech-decomposition"
version = "0.2.0"
description = "Multi-repo code Q&A + query → AI tech decomposition"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai>=0.0.13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "mcp>=1.2",
    "tree-sitter>=0.23",
    "markdown>=3.7",
    "grep-ast>=0.9.0",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.5.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
tech-decomposition = "tech_decomposition.cli:main"
td = "tech_decomposition.cli:main"
tech-decomposition-analyze = "tech_decomposition.analyze:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# The adapter set talks to ``services/agent-node`` for cursor, cline_sdk, gemini;
# optional extras remain empty for ``.[adapters]``.
adapters = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_decomposition"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
