[project]
name = "ticket-recon"
version = "0.1.0"
description = "Jira ticket → multi-repo context → AI-friendly tech decomposition"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai>=0.0.13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "mcp>=1.2",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "markdown>=3.7",
]

[project.scripts]
ticket-recon = "ticket_recon.cli:main"
ticket-recon-analyze = "ticket_recon.analyze:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_recon"]

[tool.ruff]
line-length = 100
target-version = "py311"
