# Local overlay for docker-compose.yml.
#
# Used by `make up` and `make dev`:
#   docker compose -f docker-compose.yml -f compose.local.yaml up -d
#
# Publishes Sourcebot on the host so you can hit the Sourcebot UI directly
# (Settings → API Keys, etc.). Override SOURCEBOT_HOST_PORT in .env if the
# default collides with another local service. Prod mode skips this overlay
# and Sourcebot stays internal-only.

services:
  sourcebot:
    ports:
      - "${SOURCEBOT_HOST_PORT:-13000}:3000"
