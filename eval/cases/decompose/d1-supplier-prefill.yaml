id: d1-supplier-prefill
tags: [cross-repo, traceability, frontend, ux-flow]
description: |
  Multi-repo behavior question framed as a query. Tests whether the
  decompose pipeline can: identify both the frontend and traceability repos,
  call out the data-flow risk when the editing user is deleted, and break
  the work into a handful of concrete subtasks.

input:
  query: |
    Title: Pre-fill supplier questionnaire on behalf of supplier

    An internal employee logs in on behalf of a supplier, pre-fills a
    questionnaire, and saves the responses. The supplier then logs in,
    reviews the information, and submits.

    Questions to answer in the decomposition:
    1. What happens if the internal representative who edited the questionnaire
       is later removed as a user? Specifically: what happens to the edited
       answers — are they orphaned, deleted, blocked, or visible?
    2. List any technical limitations or considerations.

    Produce subtasks that an autonomous coding agent could pick up and
    implement to make this flow safe and complete.
  mode: auto

expected:
  min_subtasks: 3
  max_subtasks: 10
  must_touch_repos: [frontend, traceability]
  must_mention_files:
    - questionnaire
  gold_decomposition: |
    Overview: Internal employees can pre-fill supplier questionnaires on behalf of suppliers;
    suppliers later review and submit. Engineering must cover both frontend UX and traceability
    persistence, and explicitly answer what happens to pre-filled answers if the internal editor
    account is later deleted or deactivated.

    Affected repos: frontend, traceability

    Risk: Orphaned or inconsistent questionnaire state if the editing user is removed.
    Risk: Authorization — only appropriate internal roles may edit on behalf of a supplier.

    - Traceability: locate questionnaire response storage and foreign keys to the editing user;
      document whether answers are orphaned, reassigned, blocked, or still visible after user deletion.
    - Frontend: map the on-behalf-of flow (login context, save, supplier review/submit) and which
      roles can access it.
    - Traceability + frontend: define product behavior when the internal representative is removed
      (retain answers vs purge vs lock submission).
    - Add tests or acceptance criteria for save → supplier review → submit and for user-deletion edge case.
