id: i1-trivial-docstring
tags: [trivial, single-file, docs]
description: |
  Smallest possible implement task — verifies the implement runner provisions
  a worktree, the adapter makes *some* change, and a branch/MR comes back.
  Use this to sanity-check that an adapter is wired up at all.

input:
  repo: traceability
  free_text: |
    Add a one-line docstring to the first Python function in the repo that
    is currently missing one. Just describe what the function does in
    plain English. Don't change behavior.
  base_branch: main
  draft: true

expected:
  min_files_changed: 1
  must_touch_paths: [".py"]
  must_not_touch_paths: ["package.json", "yarn.lock", "pnpm-lock.yaml"]
  # Leave require_mr unset so the case passes even without GITLAB_TOKEN —
  # set it to true once you've configured the token.
