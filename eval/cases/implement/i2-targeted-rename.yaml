id: i2-targeted-rename
tags: [small, targeted, refactor]
description: |
  Slightly more involved than the docstring case: a targeted rename that
  requires reading some code first. Tests whether the adapter can stay
  inside its lane (no surprise rewrites of adjacent code).

input:
  repo: traceability
  free_text: |
    Find the function `get_supplier_by_id` (or its closest equivalent
    name in this codebase) and rename it to `fetch_supplier_by_id`.
    Update every call site. Do not change behavior. Do not touch
    unrelated files.
  base_branch: main
  draft: true

expected:
  min_files_changed: 1
  must_touch_paths: [".py"]
  must_not_touch_paths: ["README", "node_modules"]
