[[questions]]
id = "q-data-sharing-geolocation"
tags = ["single-repo", "traceability", "behavior"]
text = "On Data Sharing, if I do not select anything aside from Geolocation, what will show when I import? Will I be able to see any of my Deforestation status?"
[questions.expected]
min_chars = 150
must_mention = ["deforestation", "geolocation"]
should_mention = ["includeGeolocation", "includeDeforestation", "GeoSpatialDumpStrategy"]
expected_files = [
    "traceability/src/utils/data_sharing/dump_strategies.py",
    "traceability/src/utils/data_sharing/builder.py",
    "traceability/src/models/data_sharing.py",
]
gold_answer = """
No — selecting only Geolocation does NOT include Deforestation status on import.

- includeGeolocation includes: node_name, geo_id, node_id, geo (spatial data), plot_id, area, country.
- includeDeforestation (must be explicitly checked) includes: deforestation_status, monitoring_status, previous_deforestation_status, explanation, status_updated_at.
- GeoSpatialDumpStrategy enforces strict separation: if Deforestation is not selected, those fields are excluded from the package.
"""

[[questions]]
id = "q-tcl-threshold-sharing"
tags = ["cross-repo", "data", "traceability", "behavior"]
text = "on data sharing to another environment, if I share deforestation status, and the receiver environment has different TCL threshold from the sender, which will be used to determine deforestation status in the receiver environment?"
[questions.expected]
min_chars = 200
must_mention = ["sender", "TCL"]
should_mention = ["import", "merge", "recalculation"]
expected_files = [
    "data/src/composer/dag/import_package.py",
    "traceability/src/utils/data_sharing/dump_strategies.py",
    "traceability/src/sqlalchemy_pg/repositories/deforestation_thresholds_repository.py",
]
gold_answer = """
The sender's deforestation status is used in the receiver environment. Receiver's TCL thresholds are NOT automatically applied during import.

- Data export: current deforestation_status of each geolocation is captured from the sender and stored in the data files (e.g. geo_spatial.ndjson).
- Data import: the import_package Airflow DAG uses a SQL merge to upsert into the receiver's GeoSpatial table, copying DeforestationStatus directly from the imported data.
- Threshold application: the receiver's DeforestationThresholds table is used primarily for UI display, NOT to re-evaluate imported status during import.
- Recalculation: master_data_manager DAG has a recalculation task but it's a no-op during standard imports (requires a country_name parameter that import_package doesn't provide). Re-evaluation only happens on manual trigger or when receiver thresholds are updated for a country.
"""

[[questions]]
id = "q-dashboard-suppliers-count"
tags = ["cross-repo", "frontend", "traceability", "data"]
text = "In the dashboard, what number is the 'Suppliers' number? It does not fit the number on Suppliers page. Trace where each number is computed and explain the difference."
[questions.expected]
min_chars = 200
must_mention = ["BigQuery", "PostgreSQL"]
should_mention = ["SupplyChainSourcingFarms", "Organization"]
expected_files = [
    "traceability/src/services/analytics_service.py",
    "traceability/src/sqlalchemy_pg/repositories/organizations_repository.py",
    "frontend/src/components/Dashboard/GeneralMetricTiles/GeneralMetricTiles.tsx",
]
gold_answer = """
The dashboard's "Suppliers" number ≠ the Suppliers page count because they come from different sources and apply different filters.

Dashboard:
- Source: SupplyChainSourcingFarms table in BigQuery.
- Counts only unique suppliers that have actual sourcing data (shipments, farm associations).
- Subject to global Dashboard Filters (date range, products, countries).
- Updated periodically via Airflow tasks; shows a "Last updated" timestamp.

Suppliers page:
- Source: Organization table in PostgreSQL.
- Counts all active suppliers registered, regardless of whether they have sourcing data.
- Real-time.
- Independent of dashboard filters.
"""


