# ===========================================================================
# RBAC / roles
# ===========================================================================

[[questions]]
id = "q-user-roles"
tags = ["cross-repo", "frontend", "traceability", "rbac", "enumeration"]
text = "what are the current user roles we have in the platform and describe what each role can do?"
[questions.expected]
min_chars = 200
must_mention = ["DATA_VIEWER", "DATA_UPLOADER", "DATA_ADMIN", "DATA_SUBMITTER"]
should_mention = ["RolesChecker", "deprecated", "supplier"]
# Files that, if retrieved, give the model the answer. Recall = fraction of these
# that appear in metrics.extra.grounding_paths.
expected_files = [
    "traceability/src/common/constants.py",
    "traceability/src/models/user_model.py",
    "traceability/src/common/keycloak_auth/rbac.py",
    "frontend/src/state/user.state.constants.ts",
]
gold_answer = """
The platform uses role-based access control via Keycloak. Five roles exist:

- DATA_ADMIN ("User admin") — full administrative access: manage users (create/activate/deactivate/list), manage suppliers and connected environments, full access to master data and segments.
- DATA_UPLOADER ("Data uploader") — upload data, create/update/delete segments, create/update master data nodes. Inherits DATA_VIEWER permissions automatically on creation.
- DATA_VIEWER ("Data viewer") — read-only: view countries, segments, static master data; access read-only endpoints for filtering and searching.
- DATA_SUBMITTER ("Data submitter") — specifically for submitting Due Diligence Statements (DDS); supplier-specific APIs for master data and segments; view product options and country codes.
- DATA_SUPPLIER ("Data supplier") — deprecated and being phased out; authorization removed from most controllers, kept only for legacy supplier-list UI.

Defined as constants in traceability/src/common/constants.py and as a StrEnum (UserRoles) in traceability/src/models/user_model.py; enforced by RolesChecker dependency on FastAPI routes.
"""

[[questions]]
id = "q-viewer-settings-access"
tags = ["cross-repo", "frontend", "traceability", "rbac"]
text = "can DATA_VIEWER_ROLE access the Settings area at all? Find where Settings access is gated and which roles pass that gate."
[questions.expected]
min_chars = 150
must_mention = ["DATA_VIEWER", "uploader", "admin"]
should_mention = ["Settings", "route"]
expected_files = [
    "frontend/src/routes/Layout.tsx",
    "frontend/src/state/user.state.constants.ts",
]
gold_answer = """
No. DATA_VIEWER_ROLE cannot access the Settings area in the UI.

Gating:
- Routing: /settings and sub-routes (/settings/preferences, /settings/geolocation/audit-log) only render for uploader or admin roles.
- Navigation: the "Settings" link in the top nav is conditionally shown only to uploader or admin.
- Sidebar: viewer's sidebar config doesn't include Settings.

Note: the backend API technically allows DATA_VIEWER_ROLE to GET some settings endpoints (e.g. global deforestation settings), but the UI doesn't expose them. Viewers can access "Master Data" under "Data Manager" (separate area).
"""

[[questions]]
id = "q-viewer-prereq-uploader"
tags = ["cross-repo", "frontend", "traceability", "rbac"]
text = "do I need to have DATA_VIEWER_ROLE on my account in order to access what DATA_UPLOADER_ROLE can do? Is data viewer a prerequisite for data_uploader?"
[questions.expected]
min_chars = 150
must_mention = ["DATA_VIEWER", "DATA_UPLOADER", "RolesChecker"]
should_mention = ["OR", "independent"]
expected_files = [
    "traceability/src/common/keycloak_auth/rbac.py",
    "traceability/src/common/constants.py",
]
gold_answer = """
No, DATA_VIEWER_ROLE is not a prerequisite for DATA_UPLOADER_ROLE. They are independent roles.

- RolesChecker uses OR logic: an endpoint grants access if the user has ANY of the listed roles.
- For uploading/modification (POST/PATCH/DELETE), DATA_UPLOADER_ROLE alone is sufficient.
- For viewing (GET), most endpoints list BOTH viewer and uploader, so uploader can view without needing viewer.
- Exception: a few endpoints (listing products, certain aggregated views) only list DATA_VIEWER_ROLE. A pure uploader would be denied on those specific routes.

User-creation flow does auto-assign DATA_VIEWER when DATA_UPLOADER is requested, but that's a service-level convenience, not an authorization prerequisite.
"""

[[questions]]
id = "q-multi-role-user"
tags = ["cross-repo", "frontend", "traceability", "rbac"]
text = "can one user have more than one role, for example data viewer and data uploader?"
[questions.expected]
min_chars = 100
must_mention = ["multiple", "roles"]
should_mention = ["realm_access", "Keycloak", "RolesChecker"]
expected_files = [
    "traceability/src/common/keycloak_auth/rbac.py",
    "frontend/src/state/user.state.constants.ts",
]
gold_answer = """
Yes. The system is designed for multi-role users.

- Roles are managed in Keycloak and delivered as a list in the JWT's realm_access.roles claim.
- Backend RolesChecker extracts the role list from the user's identity and checks if any user role matches the authorized roles for the endpoint.
- Frontend stores roles in a Set and provides hooks like hasAnyRole / hasAllRoles for permission checks against multiple roles simultaneously.
"""


