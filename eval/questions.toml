[[questions]]
id = "q-farm-name-unicode"
tags = ["single-repo", "frontend", "traceability", "validation"]
text = "Are other-language letters accepted in Farm Name and/or ReferenceID? For example: é, ñ, ü, ç. Look at the actual validation logic, not docs."
[questions.expected]
min_chars = 120
min_citations = 1
must_mention = ["regex"]
should_mention = ["unicode", "validator", "template"]
expected_files = [
    "frontend/src/components/settings/master-data/master-record-form/validationRules.ts",
    "traceability/src/common/constants.py",
    "traceability/src/models/master_data_model.py",
]
gold_answer = """
Non-English characters (é, ñ, etc.) are accepted by the TEMPLATE-UPLOAD path but NOT by the UI or (for Farm Name) the API.

Farm Name (Node Name):
- Template upload: accepted (backend Master Data validator uses a Unicode word-character pattern).
- UI (manual entry): NOT accepted — frontend pattern /^[a-zA-Z0-9-_,.'&#(/)%]+$/.
- API: NOT accepted — strict ASCII pattern ^[a-zA-Z0-9-_,.'()&%#/]+$.

ReferenceID (External ID):
- Template upload: accepted (Master Data validator uses Unicode-letter pattern). Note Traceability template uses a stricter ASCII pattern when ReferenceID is a node identifier.
- UI: NOT accepted — frontend pattern /^[A-Za-z0-9]+(?:[._'’-][A-Za-z0-9]+)*$/.
- API: accepted (IDENTIFIER_STRING_PATTERN allows Unicode letters).
"""

[[questions]]
id = "q-farm-name-special-chars"
tags = ["single-repo", "frontend", "traceability", "validation"]
text = "What special characters are NOT allowed in Farm Name and/or ReferenceID? Cite the exact regex / validator that enforces this."
[questions.expected]
min_chars = 150
min_citations = 1
must_mention = ["regex"]
should_mention = ["NODE_NAME_PATTERN", "IDENTIFIER_STRING_PATTERN"]
expected_files = [
    "traceability/src/common/constants.py",
    "traceability/src/models/master_data_model.py",
    "frontend/src/components/settings/master-data/master-record-form/validationRules.ts",
]
gold_answer = """
Farm Name (NODE_NAME_PATTERN):
- Allowed: alphanumeric, space, and these specials: - _ , . ' ( ) & % # /
- Restricted: ! @ $ ^ * + = [ ] { } | \\ : ; " < > ? ~

Reference ID (IDENTIFIER_STRING_PATTERN, API):
- Allowed: alphanumeric, with single separators between alphanumeric groups: space, . _ - ' ’
- Rules: consecutive separators NOT allowed; cannot start or end with a separator; ID must start and end with letter/digit.
- Restricted: & % # / ( ) ! @ etc.
- Bulk-upload pattern (reference_id_pattern) is even stricter: max 255 chars, only alphanumeric, space, underscore, hyphen, dot.
"""

[[questions]]
id = "q-startnode-validation"
tags = ["single-repo", "traceability", "validation"]
text = "when a supplier uploads the traceability template, do we check if the StartNodeName matches with the StartNodeID?"
[questions.expected]
min_chars = 150
must_mention = ["StartNodeID", "StartNodeName"]
should_mention = ["master data", "overwrite"]
expected_files = [
    "traceability/src/models/template_configuration.py",
    "traceability/src/excel_generator/schema_config.py",
]
gold_answer = """
No — the system does not check that StartNodeName matches StartNodeID. Instead, the StartNodeID is used to look up the node from master data and the system overwrites the supplied name with the official one.

- StartNodeID is mandatory; StartNodeName is not.
- ID validation: StartNodeID must exist in MasterData records, otherwise a validation error is raised.
- During ingestion, an enrichment step joins to master data and OVERWRITES StartNodeName, StartNodeType, StartNodeCountry with the official values for that StartNodeID.
- EndNodeID / EndNodeName follow the same pattern.
"""

[[questions]]
id = "q-geojson-country-check"
tags = ["cross-repo", "data-cloud-functions", "data", "validation"]
text = "on geojson upload, in static check, how is the country being checked?"
[questions.expected]
min_chars = 150
must_mention = ["NodeID", "country"]
should_mention = ["static", "SQL", "master data"]
expected_files = [
    "data-cloud-functions/src/cloud_functions/composer_dag_trigger/geolocation/geo_validator.py",
    "data-cloud-functions/src/cloud_functions/composer_dag_trigger/geolocation/validators.py",
]
gold_answer = """
During the static check, the country is NOT validated in the GeoJSON file itself. The GeoJSON doesn't carry a Country property — instead it must carry a NodeID, and country is resolved later.

- GeoJSON files are not required to have a Country property in their features.
- The system ensures a NodeID property is present on each feature.
- Country is resolved in the SQL validation step by joining the uploaded geospatial data with Master Data on NodeID.
- Static validators (Cloud Functions) only check structural and geometric integrity: FeatureCollection / Feature / Point / Polygon / MultiPolygon types, coordinate precision and ranges, ring closure, duplicate vertices, self-intersections, and NodeID presence.
"""


