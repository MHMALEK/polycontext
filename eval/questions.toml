# Architecture
# ===========================================================================

[[questions]]
id = "q-jwt-stateless"
tags = ["single-repo", "traceability", "architecture"]
text = "how does user authorization work currently with JWT? Do we use it as a stateless token with no interaction with Keycloak once the token is issued, or do we call Keycloak on every REST call for introspection?"
[questions.expected]
min_chars = 200
must_mention = ["stateless", "JWT"]
should_mention = ["JWKS", "RolesChecker", "Keycloak"]
expected_files = [
    "traceability/src/common/keycloak_auth/auth.py",
    "traceability/src/common/keycloak_auth/rbac.py",
]
gold_answer = """
Stateless. The system does NOT call Keycloak for introspection on every REST call — it validates the JWT locally.

- Local validation: get_identity decodes and validates the JWT locally via jwt.decode.
- Cached public keys (JWKS): to verify signatures the system fetches Keycloak's JWKS once and caches it for 15 minutes (900s) to minimize network overhead.
- Claim verification: verifies the iss (issuer) claim; allows 60s clock-skew leeway. The aud (audience) check is currently disabled for legacy compatibility.
- RBAC: once the token is validated, roles are extracted from realm_access and checked against required roles via the RolesChecker dependency.

The KeycloakService class exists in the codebase but is reserved for administrative operations (creating users, assigning roles) and is not part of the standard request-authorization flow.
"""

