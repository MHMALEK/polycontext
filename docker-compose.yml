services:
  postgres:
    image: postgres:16
    container_name: ticket-recon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - sourcebot_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: ticket-recon-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - sourcebot_redis:/data

  sourcebot:
    image: ghcr.io/sourcebot-dev/sourcebot:latest
    container_name: ticket-recon-sourcebot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount the parent folder containing the 4 repo clones, read-only.
      # Sourcebot config.json globs file:///data/repos/* so each subdir gets indexed.
      - ${REPOS_ROOT:-/Users/mohammadhosseinmalek/tract-projects/aider-experiments}:/data/repos:ro
      - ./config/sourcebot/config.json:/data/config.json:ro
      - sourcebot_data:/data/.sourcebot
    environment:
      - CONFIG_PATH=/data/config.json
      - AUTH_URL=http://localhost:3000
      - AUTH_SECRET=${SOURCEBOT_AUTH_SECRET}
      - SOURCEBOT_ENCRYPTION_KEY=${SOURCEBOT_ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379
      # Sourcebot's AI Q&A (/api/chat) uses an LLM. Pass the same Gemini key
      # the app uses; Sourcebot will pick up at least one of these env names.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GEMINI_API_KEY:-}

  serena:
    image: ghcr.io/oraios/serena:latest
    container_name: ticket-recon-serena
    restart: unless-stopped
    ports:
      - "9121:9121"
    volumes:
      # Same parent folder mounted at Serena's expected location.
      # Serena treats this single path as one project — it sees all 4 repos at once.
      # Mounted writable because Serena writes a `.serena/` config dir at the root
      # (alongside the repo folders, NOT inside them). Harmless to your repos.
      - ${REPOS_ROOT:-/Users/mohammadhosseinmalek/tract-projects/aider-experiments}:/workspaces/projects
    command: >
      serena start-mcp-server
      --transport sse
      --host 0.0.0.0
      --port 9121
      --project /workspaces/projects

volumes:
  sourcebot_data:
  sourcebot_postgres:
  sourcebot_redis:
