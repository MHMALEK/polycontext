# Project name locked to `ticket-recon` so the docker resource names
# (volumes, networks) stay stable regardless of where the repo lives on
# disk. The GitLab repo / folder is named `tech-decomposition`, but the
# existing Sourcebot index + Postgres volumes were created under
# `ticket-recon` and we don't want to orphan them.
name: ticket-recon

services:
  postgres:
    image: postgres:16
    container_name: tech-decomposition-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - sourcebot_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: tech-decomposition-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - sourcebot_redis:/data

  sourcebot:
    image: ghcr.io/sourcebot-dev/sourcebot:latest
    container_name: tech-decomposition-sourcebot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Sourcebot's host port (3000) is published only in the local overlay
    # (compose.local.yaml), not in this base file. Prod mode (make prod)
    # therefore keeps Sourcebot off the host network — the app talks to it
    # over the docker network at http://sourcebot:3000.
    volumes:
      # Bind-mount the parent folder containing the 4 repo clones, read-only.
      # Sourcebot config.json globs file:///data/repos/* so each subdir gets indexed.
      - ${REPOS_ROOT:-/Users/mohammadhosseinmalek/tract-projects/aider-experiments}:/data/repos:ro
      - ./config/sourcebot/config.json:/data/config.json:ro
      - sourcebot_data:/data/.sourcebot
    environment:
      - CONFIG_PATH=/data/config.json
      # Sourcebot's NextAuth callback URL — must match the browser-visible
      # origin (i.e. the host publish from compose.local.yaml).
      - AUTH_URL=http://localhost:${SOURCEBOT_HOST_PORT:-13000}
      - AUTH_SECRET=${SOURCEBOT_AUTH_SECRET}
      - SOURCEBOT_ENCRYPTION_KEY=${SOURCEBOT_ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379
      # Sourcebot's AI Q&A (/api/chat) uses an LLM. Pass the same Gemini key
      # the app uses; Sourcebot will pick up at least one of these env names.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GEMINI_API_KEY:-}
      # GitLab connector token (only used when the gitlab-tract connection in
      # config.json is enabled). Leave empty for local-mount-only setups.
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}

  serena:
    # Serena is only used by the experimental local agent (--engine local)
    # and the deep_decompose path. The default Sourcebot-backed flows don't
    # need it. Opt in with `docker compose --profile experimental up`.
    profiles: ["experimental"]
    image: ghcr.io/oraios/serena:latest
    container_name: tech-decomposition-serena
    restart: unless-stopped
    ports:
      - "9121:9121"
    volumes:
      - ${REPOS_ROOT:-/Users/mohammadhosseinmalek/tract-projects/aider-experiments}:/workspaces/projects
    command: >
      serena start-mcp-server
      --transport sse
      --host 0.0.0.0
      --port 9121
      --project /workspaces/projects

  # The tech-decomposition FastAPI + CLI. Builds from the local Dockerfile so
  # iterating on the Python code only rebuilds this service. Talks to the
  # in-stack Sourcebot at http://sourcebot:3000 (the docker network host).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tech-decomposition:local
    container_name: tech-decomposition-app
    restart: unless-stopped
    depends_on:
      sourcebot:
        condition: service_started
    ports:
      # Container always listens on 8000 internally; host publish is
      # configurable so it doesn't fight other local services on :8000.
      - "${API_PORT:-18000}:8000"
    volumes:
      - tech_decomposition_outputs:/app/outputs
    # Allow reaching agent-node published on host at :13100 (Linux Compose).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Resolved by agent-node reachable from this container — not localhost.
      # Use compose.adapters.yaml to switch to http://agent_node:13100 instead.
      - AGENT_NODE_URL=http://host.docker.internal:13100
      # Cursor (optional — pass through .env).
      - CURSOR_API_KEY=${CURSOR_API_KEY:-}
      - CURSOR_SDK_MODEL=${CURSOR_SDK_MODEL:-composer-2}
      # Talk to the Sourcebot container by service name on the docker network.
      - SOURCEBOT_URL=http://sourcebot:3000
      - SOURCEBOT_API_KEY=${SOURCEBOT_API_KEY:-}
      - SOURCEBOT_TIMEOUT_SECONDS=${SOURCEBOT_TIMEOUT_SECONDS:-300}
      # Optional: scope ask flows to specific GitLab project paths.
      - GITLAB_PROJECTS=${GITLAB_PROJECTS:-}
      # Provider credentials — only the ones for the models you actually use
      # need to be set.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CUSTOM_LLM_BASE_URL=${CUSTOM_LLM_BASE_URL:-}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY:-}
      # Per-stage model selection (see core/models.py for spec syntax).
      - ENRICH_MODEL=${ENRICH_MODEL:-gemini:gemini-2.5-flash}
      - DECOMPOSE_MODEL=${DECOMPOSE_MODEL:-gemini:gemini-2.5-pro}
      # Jira posting (optional — only needed for --post-to-jira).
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      # Outputs live in a named volume so they persist across restarts.
      - OUTPUT_DIR=/app/outputs

volumes:
  sourcebot_data:
  sourcebot_postgres:
  sourcebot_redis:
  tech_decomposition_outputs:
