# Optional compose overlay: agent-node (Cursor, Cline, Claude Code SDK, Gemini, OpenAI Agents, Sourcebot).
#
# Not part of the default `make up` / `make dev` stack — start with:
#     docker compose -f docker-compose.yml -f compose.local.yaml -f compose.adapters.yaml up -d
# or: `make adapters`

services:

  app:
    depends_on:
      agent_node:
        condition: service_started
    environment:
      # Reach in-stack agent-node; 127.0.0.1 and host.docker.local would miss it.
      AGENT_NODE_URL: http://agent_node:13100
      # agent-node container must not use 127.0.0.1:hostPort — use docker DNS to Sourcebot.
      SOURCEBOT_URL_FOR_AGENT_NODE: http://sourcebot:3000

  agent_node:
    build:
      context: ./services/agent-node
    ports:
      - "${AGENT_NODE_PORT:-13100}:13100"
    environment:
      LOG_LEVEL: ${AGENT_NODE_LOG_LEVEL:-info}
      PORT: "13100"
      HOST: "0.0.0.0"
      CURSOR_API_KEY: ${CURSOR_API_KEY}
      CURSOR_SDK_MODEL: ${CURSOR_SDK_MODEL:-composer-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_CODE_MODEL: ${CLAUDE_CODE_MODEL:-claude-sonnet-4-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_SDK_MODEL: ${GEMINI_SDK_MODEL:-gemini-2.5-pro}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_AGENTS_SDK_MODEL: ${OPENAI_AGENTS_SDK_MODEL:-gpt-4.1}
      # Same docker network as ``sourcebot`` — avoid localhost (wrong inside the container).
      SOURCEBOT_URL: ${BRIDGE_SOURCEBOT_URL:-http://sourcebot:3000}
      SOURCEBOT_API_KEY: ${SOURCEBOT_API_KEY}
      # Optional Serena MCP server (LSP-backed semantic tools for Cursor + Claude Code).
      # When agent_node runs in Docker and Serena runs on the host, set in .env:
      #   SERENA_URL=http://host.docker.internal:9121/sse
      SERENA_URL: ${SERENA_URL:-}
      SERENA_API_KEY: ${SERENA_API_KEY:-}
    volumes:
      - "${REPOS_ROOT}:${REPOS_ROOT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
