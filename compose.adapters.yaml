# Optional compose overlay: adapter sidecars.
#
# Not part of the default `make up` / `make dev` stack — start with:
#     docker compose -f docker-compose.yml -f compose.local.yaml -f compose.adapters.yaml up -d
# or the convenience target:
#     make adapters
#
# Currently the only sidecar is the cline-sdk-bridge — a tiny Node service
# that exposes @cline/sdk over HTTP so the Python ``cline_sdk`` adapter can
# call it. The OpenCode and Cursor adapters run as subprocesses on the host
# and don't need a sidecar.

services:

  cline_sdk_bridge:
    build:
      context: ./bridge/cline_sdk
    ports:
      - "${CLINE_SDK_BRIDGE_PORT:-13040}:3040"
    environment:
      LOG_LEVEL: ${CLINE_SDK_BRIDGE_LOG_LEVEL:-info}
      # Sourcebot is reachable from the bridge container via the host's
      # localhost. ``host.docker.internal`` works out-of-the-box on Docker
      # Desktop; the extra_hosts entry below makes it work on Linux too.
      SOURCEBOT_URL: ${BRIDGE_SOURCEBOT_URL:-http://host.docker.internal:${SOURCEBOT_HOST_PORT:-13000}}
      SOURCEBOT_API_KEY: ${SOURCEBOT_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
